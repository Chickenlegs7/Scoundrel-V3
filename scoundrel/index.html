<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#151515" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=2.1" />
  <title>Scoundrel</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Scoundrel</h1>
        <p class="sub">Solo Dungeon Card Game</p>
      </div>
      <button id="newGameBtn" class="secondary">New Game</button>
    </header>

    <section class="stats" aria-label="Game status">
      <div class="stat"><span>HP</span><strong id="hp">20</strong></div>
      <div class="stat"><span>Weapon</span><strong id="weapon">None</strong></div>
      <div class="stat"><span>Last Kill</span><strong id="lastKill">—</strong></div>
      <div class="stat"><span>Deck</span><strong id="deckCount">0</strong></div>
    </section>

    <section class="career" aria-label="Run statistics">
      <div class="career-stat current"><span>Last Run</span><strong id="lastScore">—</strong></div>
      <div class="career-stat"><span>High Score</span><strong id="highScore">—</strong></div>
      <div class="career-stat"><span>Wins</span><strong id="wins">0</strong></div>
      <div class="career-stat"><span>Losses</span><strong id="losses">0</strong></div>
    </section>

    <section class="message" id="message">Choose a card to begin.</section>

    <section>
      <div class="section-row">
        <h2>Room</h2>
        <span id="roomProgress">Resolve 3 of 4</span>
      </div>
      <div id="room" class="room" aria-live="polite"></div>
    </section>

    <section class="actions">
      <button id="fleeBtn" class="danger">Flee Room</button>
    </section>

    <section class="log-wrap">
      <h2>Adventure Log</h2>
      <div id="log" class="log"></div>
    </section>
  </main>

  <dialog id="gameOverDialog">
    <div class="dialog-card">
      <h2 id="gameOverTitle">Game Over</h2>
      <p id="gameOverText"></p>
      <div class="run-score">Run Score <strong id="gameOverScore">0</strong></div>
      <button id="restartBtn">Play Again</button>
    </div>
  </dialog>


  <dialog id="combatDialog">
    <div class="dialog-card combat-dialog-card">
      <h2 id="combatTitle">Fight Monster</h2>
      <p id="combatText"></p>
      <div class="combat-options">
        <button id="barehandBtn" class="combat-option barehand">Fight Bare-Handed</button>
        <button id="weaponAttackBtn" class="combat-option weapon-attack">Use Weapon</button>
        <button id="combatCancelBtn" class="secondary combat-cancel">Cancel</button>
      </div>
    </div>
  </dialog>

  <script src="app.js?v=2.1"></script>
</body>
</html>
